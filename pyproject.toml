[project]
name = "profact"
version = "0.1.0"
description = "Prompt-native version control for AI-assisted development"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "watchfiles>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
profact = "profact.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["profact*"]
